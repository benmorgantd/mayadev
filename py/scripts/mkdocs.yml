site_name: bmaya Pipeline Documentation
site_description: Rigging & Tool Pipeline Framework Architecture

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

# Managed automatically by your batch suite post-run callback loop
nav:
  - Home: index.md
  - Manual Guides:
    - Architecture Overview: guides/architecture_overview.md
  - API Reference:
    - Core:
      - Eventsregistry: rigging/core/eventsregistry.md
      - Log: rigging/core/log.md
    - Utils:
      - Decorators: rigging/utils/decorators.md