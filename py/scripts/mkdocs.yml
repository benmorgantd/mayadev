site_name: bmaya Documentation

theme:
  name: material
  features:
    - search.suggest
    - search.highlight
  
  # --- DARK MODE & PALETTE TOGGLE SETUP ---
  palette:
    # Scheme toggle for Dark Mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      # Scheme toggle for Light Mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search

